services:
  - type: web
    name: studypulse-api
    runtime: java
    plan: free
    rootDir: studypulse
    buildCommand: chmod +x mvnw && ./mvnw -DskipTests clean package
    startCommand: java -jar target/studypulse-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: STUDYPULSE_DB_URL
        sync: false
      - key: STUDYPULSE_DB_USERNAME
        sync: false
      - key: STUDYPULSE_DB_PASSWORD
        sync: false
      - key: STUDYPULSE_JWT_SECRET
        sync: false
      - key: STUDYPULSE_CORS_ORIGINS
        sync: false
